name: iOS

on:
  push:
    branches:
      - 'master'
      - 'release/**'
  pull_request:
    branches:
      - 'master'
      - 'release/**'

jobs:
  build:
    name: build
    runs-on: macOS-latest
    strategy:
      matrix:
        scheme: ["CBL_ObjC", "CBL_Swift"]
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with: 
          submodules: recursive
      - name: "Build-for-testing"
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          xcodebuild build-for-testing -scheme "${SCHEME}" -project CouchbaseLite.xcodeproj  -destination "generic/platform=iOS Simulator"